name: Actualizar noticias de León XIV

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Obtener noticias de El Tribuno
        run: python scripts/update_news.py

      - name: Obtener fotos del carrusel de Salta
        run: python scripts/update_salta_cards.py

      - name: Guardar noticias y fotografías actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/salta-cards.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar minuto a minuto y fotografías de Salta"
            git push
          fi
